name: website

# Builds happy-highrise.com from website/ and publishes it on GitHub Pages.
#
# This file is a TEMPLATE in the private game repository (website/deploy/).
# scripts/sync-website.py installs it as .github/workflows/website.yml in the
# public <repo>_website repository, which is the one GitHub Pages serves from.
# Edit it here, never in the public copy: the next sync overwrites that.
#
# It runs on every push to main of the public repository (each push is a
# sync), and by hand (Actions -> website -> Run workflow). The build is
# website/build.py, standard-library Python only; the pictures and trailer it
# serves are already made and committed (website/make_media.py), so nothing
# here needs Pillow or ffmpeg.
#
# One-time setup, in the PUBLIC repository's Settings -> Pages:
#   Source: GitHub Actions
#   Custom domain: happy-highrise.com, then tick "Enforce HTTPS" once the
#   certificate is issued.
# And at the domain's DNS: see website/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a deploy
# that is already half way out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: build the site
        run: python3 website/build.py --out _site

      - name: check every page links only to files that exist
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          site = Path("_site")
          bad = []
          for page in site.rglob("*.html"):
              text = page.read_text()
              for ref in re.findall(r'(?:href|src|poster)="([^"]+)"', text) + \
                         [u.split()[0] for s in re.findall(r'srcset="([^"]+)"', text) for u in s.split(",")]:
                  if re.match(r"^(https?:|mailto:|#|data:)", ref):
                      continue
                  path = unquote(urlsplit(ref).path)
                  target = (site / path.lstrip("/")) if path.startswith("/") else (page.parent / path)
                  if target.is_dir() or path.endswith("/") or path in ("", "./"):
                      target = target / "index.html"
                  if not target.resolve().exists():
                      bad.append(f"{page.relative_to(site)} -> {ref}")
          if bad:
              print("broken links:\n  " + "\n  ".join(bad))
              sys.exit(1)
          print("all links resolve")
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
